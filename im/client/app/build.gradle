plugins {
    id 'com.android.application'
}

def serverUrl = providers.gradleProperty('IM_SERVER_URL').getOrElse('https://im.lxvb.top')
def discoveryHost = providers.gradleProperty('IM_DISCOVERY_HOST').getOrElse('')
def appCenterUrl = providers.gradleProperty('APP_CENTER_URL').getOrElse('https://apps.lxvb.top')

android {
    namespace 'com.linkup.im'
    compileSdk 36

    defaultConfig {
        applicationId 'com.linkup.im'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '1.6.0'

        buildConfigField 'String', 'SERVER_URL', '"' + serverUrl + '"'
        buildConfigField 'String', 'DISCOVERY_HOST', '"' + discoveryHost + '"'
        buildConfigField 'String', 'APP_CENTER_URL', '"' + appCenterUrl + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartext: 'true']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [usesCleartext: 'false']
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'io.github.webrtc-sdk:android:144.7559.09'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
