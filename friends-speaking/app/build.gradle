plugins {
    id 'com.android.application'
}

android {
    namespace 'com.firewolf.friendsspeaking'
    compileSdk 36

    defaultConfig {
        applicationId 'com.firewolf.friendsspeaking'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.2.0'
        buildConfigField 'String', 'APP_CENTER_URL', '"https://apps.lxvb.top"'
        buildConfigField 'String', 'MEDIA_BASE_URL', '"http://10.3.42.150:8000"'

        if (project.hasProperty('targetAbi')) {
            ndk { abiFilters project.property('targetAbi').toString() }
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.12.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'org.videolan.android:libvlc-all:3.7.6'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
