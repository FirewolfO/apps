plugins {
    id 'com.android.application'
}

android {
    namespace 'com.firewolf.players'
    compileSdk 36

    defaultConfig {
        applicationId 'com.firewolf.players'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'REMOTE_CATALOG_URL', '"https://raw.githubusercontent.com/FirewolfO/apps/main/players/catalog/catalog.json"'
        buildConfigField 'String', 'APP_CENTER_URL', '"https://apps.lxvb.top"'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.srcDirs = ['../catalog']
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.12.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.work:work-runtime:2.11.2'

    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
