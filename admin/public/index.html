<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173f35">
  <title>App Center</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="loginView" class="login-view">
    <section class="login-panel">
      <div class="brand-mark">AC</div>
      <p class="eyebrow">LXVB MOBILE</p>
      <h1>App Center</h1>
      <p class="muted">移动应用发布管理</p>
      <form id="loginForm">
        <label>账号<input id="username" name="username" autocomplete="username" required></label>
        <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">登录</button>
      </form>
      <p id="loginError" class="error" role="alert"></p>
    </section>
  </main>

  <main id="workspace" class="workspace" hidden>
    <header class="topbar">
      <div><strong>App Center</strong><span>移动应用发布管理</span></div>
      <div class="top-actions"><span id="identity">admin</span><button id="logoutButton" class="quiet" type="button">退出</button></div>
    </header>
    <section class="toolbar">
      <div><p class="eyebrow">RELEASES</p><h1>应用版本</h1></div>
      <div class="toolbar-actions"><button id="deleteSelected" class="danger" type="button" disabled>删除所选</button><button id="openUpload" type="button">上传版本</button></div>
    </section>
    <section id="emptyState" class="empty-state" hidden><strong>暂无应用版本</strong><span>上传第一个 APK 后会按 App 自动分组</span></section>
    <div id="appList" class="app-list"></div>
  </main>

  <dialog id="uploadDialog">
    <form id="uploadForm" method="dialog">
      <header><div><p class="eyebrow">NEW RELEASE</p><h2>上传版本</h2></div><button id="closeUpload" class="icon-button" type="button" aria-label="关闭">×</button></header>
      <div class="form-grid">
        <label>App ID<input name="appId" pattern="[a-z][a-z0-9-]{1,47}" placeholder="linkup-im" required></label>
        <label>App 名称<input name="name" maxlength="80" placeholder="连线 IM" required></label>
        <label class="wide">应用说明<input name="description" maxlength="300" placeholder="企业即时通讯"></label>
        <label>版本号<input name="version" placeholder="1.6.0" required></label>
        <label>版本代码<input name="versionCode" type="number" min="1" placeholder="10"></label>
        <label class="wide">更新说明<textarea name="notes" maxlength="1000" rows="4"></textarea></label>
        <label class="wide file-field">APK 安装包<input name="apk" type="file" accept=".apk,application/vnd.android.package-archive" required></label>
      </div>
      <p id="uploadError" class="error" role="alert"></p>
      <footer><button id="cancelUpload" class="quiet" type="button">取消</button><button id="submitUpload" type="submit">发布版本</button></footer>
    </form>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
