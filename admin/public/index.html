<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173f35">
  <title>App Center</title>
  <link rel="stylesheet" href="/styles.css?v=20260826.2">
</head>
<body>
  <main class="workspace">
    <header class="topbar">
      <div class="brand"><strong>App Center</strong><span>移动应用中心</span></div>
      <div class="top-actions">
        <span id="identity" hidden></span>
        <button id="loginButton" type="button">管理APP</button>
        <button id="logoutButton" class="quiet" type="button" hidden>退出</button>
      </div>
    </header>
    <section class="toolbar">
      <div><p id="pageEyebrow" class="eyebrow">ALL RELEASES</p><h1 id="pageTitle">全部应用</h1></div>
      <div id="adminActions" class="toolbar-actions" hidden>
        <button id="deleteSelected" class="danger" type="button" disabled>删除所选</button>
        <button id="openUpload" type="button">上传版本</button>
      </div>
    </section>
    <p id="pageError" class="page-error" role="alert" hidden></p>
    <section id="emptyState" class="empty-state" hidden><strong id="emptyTitle">暂无应用版本</strong><span id="emptyDescription">应用发布后会在这里展示</span></section>
    <div id="appList" class="app-list"></div>
  </main>

  <dialog id="uploadDialog">
    <form id="uploadForm" method="dialog">
      <header><div><p class="eyebrow">NEW RELEASE</p><h2>上传版本</h2></div><button id="closeUpload" class="icon-button" type="button" aria-label="关闭">×</button></header>
      <div class="form-grid">
        <label>App ID<input name="appId" pattern="[a-z][a-z0-9-]{1,47}" placeholder="yuque" required></label>
        <label>App 名称<input name="name" maxlength="80" placeholder="语雀" required></label>
        <label class="wide">应用说明<input name="description" maxlength="300" placeholder="企业即时通讯"></label>
        <label>版本号<input name="version" placeholder="1.7.0" required></label>
        <label>版本代码<input name="versionCode" type="number" min="1" placeholder="10"></label>
        <label class="wide">更新说明<textarea name="notes" maxlength="1000" rows="4"></textarea></label>
        <label class="wide file-field">APK 安装包<input name="apk" type="file" accept=".apk,application/vnd.android.package-archive" required></label>
      </div>
      <p id="uploadError" class="error" role="alert"></p>
      <footer><button id="cancelUpload" class="quiet" type="button">取消</button><button id="submitUpload" type="submit">发布版本</button></footer>
    </form>
  </dialog>
  <script src="/app.js?v=20260826.4" defer></script>
</body>
</html>
